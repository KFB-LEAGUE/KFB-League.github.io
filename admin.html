<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>KFB Admin</title><style>body{margin:0;font-family:Arial,sans-serif;background:#f4f6f8;color:#111827}.wrap{max-width:1000px;margin:auto;padding:24px}.top{background:#08101f;color:#fff;padding:18px 24px}.top a{color:#fff;text-decoration:none}.card{background:#fff;border:1px solid #ddd;border-radius:12px;padding:20px;margin:18px 0;box-shadow:0 8px 25px #0000000d}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}label{font-size:12px;font-weight:700}input,select{display:block;width:100%;box-sizing:border-box;margin-top:6px;padding:11px;border:1px solid #ccd3dc;border-radius:7px;background:#fff}button{border:0;border-radius:7px;padding:11px 16px;font-weight:700;cursor:pointer;margin:5px 5px 0 0}.primary{background:#e63946;color:#fff}.secondary{background:#e9edf2;color:#111827}.record{display:grid;grid-template-columns:60px 1fr 1fr auto;gap:10px;align-items:center;padding:12px 0;border-bottom:1px solid #eee;font-size:13px}.muted{color:#64748b;font-size:12px}.status{font-weight:700;margin-top:12px}.danger{background:#fee2e2;color:#991b1b}@media(max-width:700px){.grid{grid-template-columns:1fr 1fr}.record{grid-template-columns:1fr}.wrap{padding:14px}}@media(max-width:430px){.grid{grid-template-columns:1fr}}</style></head><body><header class="top"><div class="wrap" style="padding:0"><a href="index.html">← KFB LEAGUE</a></div></header><main class="wrap"><h1>관리자 패널</h1><p class="muted">경기별 선수 기록을 입력하면 이 브라우저에 저장됩니다. 현재 GitHub Pages는 정적 사이트라 다른 방문자에게 자동 공개되지는 않습니다.</p><section class="card"><h2>경기 기록 입력</h2><div class="grid"><label>Round<input id="round" type="number" min="1" value="1"></label><label>팀<select id="team"></select></label><label>상대팀<select id="opponent"></select></label><label>선수<select id="player"></select></label><label>PA<input id="pa" type="number" min="0" value="0"></label><label>AB<input id="ab" type="number" min="0" value="0"></label><label>안타 H<input id="h" type="number" min="0" value="0"></label><label>2루타 2B<input id="doubles" type="number" min="0" value="0"></label><label>3루타 3B<input id="triples" type="number" min="0" value="0"></label><label>홈런 HR<input id="hr" type="number" min="0" value="0"></label><label>타점 RBI<input id="rbi" type="number" min="0" value="0"></label><label>볼넷 BB<input id="bb" type="number" min="0" value="0"></label><label>삼진 SO<input id="so" type="number" min="0" value="0"></label></div><button class="primary" id="add">기록 저장</button><button class="secondary" id="export">데이터 내보내기</button><button class="danger" id="clear">전체 삭제</button><div id="status" class="status"></div></section><section class="card"><h2>저장된 기록 <span id="count">0</span></h2><div id="records"></div></section></main><script src="admin.js?v=2"></script></body></html>
