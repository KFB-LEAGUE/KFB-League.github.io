<!DOCTYPE html><html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>KFB Admin | Player Stats</title><link rel="stylesheet" href="styles.css?v=11"></head><body><header class="site-header"><div class="container nav-wrap"><a class="logo" href="index.html"><span class="logo-mark">K</span><span class="logo-text">KFB<span>LEAGUE</span></span></a><a class="btn btn-ghost" href="index.html#players">← Players</a></div></header><main><section class="section admin-section"><div class="container"><p class="eyebrow">KFB LEAGUE · ADMIN</p><h1>Player Game Stats</h1><p class="admin-note">경기마다 선수 기록을 입력하면 브라우저에 저장하고, 아래에서 사이트용 데이터 파일을 만들 수 있습니다.</p><div class="admin-card"><div class="admin-grid"><label>Round<input id="round" type="number" min="1"></label><label>Team<select id="team"></select></label><label>Opponent<select id="opponent"></select></label><label>Player<select id="player"></select></label><label>PA<input id="pa" type="number" min="0" value="0"></label><label>AB<input id="ab" type="number" min="0" value="0"></label><label>H<input id="h" type="number" min="0" value="0"></label><label>2B<input id="doubles" type="number" min="0" value="0"></label><label>3B<input id="triples" type="number" min="0" value="0"></label><label>HR<input id="hr" type="number" min="0" value="0"></label><label>RBI<input id="rbi" type="number" min="0" value="0"></label><label>BB<input id="bb" type="number" min="0" value="0"></label><label>SO<input id="so" type="number" min="0" value="0"></label></div><div class="admin-actions"><button class="btn btn-primary" id="add">기록 추가</button><button class="btn btn-ghost" id="export">사이트용 데이터 내보내기</button><button class="btn btn-ghost" id="clear">전체 기록 삭제</button></div><p id="status" class="admin-status"></p></div><div class="admin-card"><div class="section-heading"><div><p class="eyebrow">SAVED DATA</p><h2>입력된 경기 기록</h2></div><strong id="count">0</strong></div><div id="records"></div></div></div></section></main><script src="admin.js?v=1"></script></body></html>
