<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>KFB Admin</title><link rel="stylesheet" href="styles.css?v=14"><style>.admin-wrap{max-width:1120px;margin:auto;padding:55px 4%}.admin-box{background:#fff;border:1px solid #e5e7eb;border-radius:14px;padding:22px;margin:18px 0;box-shadow:0 8px 24px #0f172a0a}.admin-grid{display:grid;grid-template-columns:1fr 220px;gap:10px}.admin-input,.admin-select,.admin-textarea{width:100%;box-sizing:border-box;border:1px solid #d7dde6;border-radius:8px;padding:11px;font:inherit}.admin-textarea{min-height:90px;resize:vertical}.admin-actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:12px}.admin-btn{border:0;border-radius:8px;padding:10px 14px;font-weight:800;cursor:pointer}.admin-primary{background:#e63946;color:#fff}.admin-secondary{background:#e9edf2;color:#334155}.admin-status,.admin-help{font-size:12px;color:#64748b;margin-top:9px}.admin-player-grid,.roster-admin-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.admin-player,.roster-admin-card{border:1px solid #e5e7eb;border-radius:12px;padding:15px;background:#fff}.admin-player-head,.roster-admin-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}.admin-player-head button,.roster-delete{border:0;background:#fff0f1;color:#d62f3d;border-radius:6px;padding:5px 8px;font-size:10px;font-weight:800}.admin-fields{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-top:9px}.admin-fields label{font-size:9px;color:#64748b;font-weight:800}.admin-fields input{width:100%;box-sizing:border-box;margin-top:3px;padding:7px;border:1px solid #e5e7eb;border-radius:6px;font-size:11px}.roster-admin-card{padding:0;overflow:hidden}.roster-admin-head{padding:15px 16px;margin:0;background:#f7f8fa}.roster-admin-head strong{font-size:15px}.roster-admin-body{padding:12px}.roster-row-edit{display:flex;gap:8px;align-items:center;margin:7px 0}.roster-row-edit input{flex:1;border:1px solid #e5e7eb;border-radius:7px;padding:8px;font-size:12px}.roster-row-edit button{border:0;background:#fff0f1;color:#d62f3d;border-radius:6px;padding:7px 9px;font-size:10px;font-weight:800}.roster-add-row{display:grid;grid-template-columns:100px 1fr auto;gap:7px;margin-top:10px}.roster-add-row select,.roster-add-row input{border:1px solid #d7dde6;border-radius:7px;padding:8px;font:inherit;font-size:11px}.roster-add-row button{border:0;background:#e9edf2;border-radius:7px;padding:8px;font-weight:800}.hidden{display:none!important}@media(max-width:760px){.admin-grid,.admin-player-grid,.roster-admin-grid{grid-template-columns:1fr}.admin-fields{grid-template-columns:repeat(2,1fr)}.roster-add-row{grid-template-columns:1fr 1fr}.roster-add-row button{grid-column:1/-1}}</style></head><body><header class="site-header"><div class="container nav-wrap"><a class="logo" href="index.html">KFB<span>LEAGUE</span></a><a href="index.html" style="color:#fff;font-weight:700;font-size:13px">← 사이트</a></div></header><main class="admin-wrap"><div class="section-heading"><div><p class="eyebrow">ADMIN PANEL</p><h1>사이트 관리</h1><p class="admin-help">선수 성적과 로스터를 관리합니다.</p></div><span class="season-badge">PRIVATE ADMIN</span></div><section id="login" class="admin-box"><h2>GitHub 인증</h2><p class="admin-help">Fine-grained token을 입력하세요. 토큰은 이 페이지의 메모리에만 있으며 저장하지 않습니다. 저장소 Contents 권한이 필요합니다.</p><input id="token" class="admin-input" type="password" autocomplete="off" placeholder="GitHub token"><div class="admin-actions"><button id="load" type="button" class="admin-btn admin-primary">데이터 불러오기</button></div><div id="login-status" class="admin-status"></div></section><section id="workspace" class="hidden"><section class="admin-box"><h2>👥 로스터 관리</h2><p class="admin-help">팀을 선택하고 선수, PM, Pre-sign을 추가하거나 삭제할 수 있습니다. 수정 후 저장하세요.</p><div id="roster-admin" class="roster-admin-grid"></div><div class="admin-actions"><button id="save-rosters" type="button" class="admin-btn admin-primary">로스터 저장 → GitHub</button></div><div id="roster-status" class="admin-status"></div></section><section class="admin-box"><h2>선수 성적</h2><div class="admin-grid"><input id="search" class="admin-input" placeholder="선수 닉네임 검색..."><select id="team" class="admin-select"><option value="">모든 팀</option><option>Yakult Swallows</option><option>KT wiz</option><option>Hyundai Unicorns</option><option>Samsung Lions</option></select></div><div class="admin-actions"><button id="add" type="button" class="admin-btn admin-secondary">+ 선수 추가</button><button id="save" type="button" class="admin-btn admin-primary">전체 저장 → GitHub</button></div><div id="status" class="admin-status"></div></section><div id="players" class="admin-player-grid"></div></section></main><footer class="footer"><div class="container footer-wrap"><div><strong>KFB LEAGUE</strong><p>KBO Futures League</p></div><p>Admin Panel</p></div></footer><script src="admin.js?v=8"></script><script src="roster-admin.js?v=2"></script></body></html>
