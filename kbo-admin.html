<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>KBO Admin</title><link rel="stylesheet" href="styles.css"><style>.admin-wrap{max-width:1120px;margin:auto;padding:55px 4%}.admin-box{background:#fff;border:1px solid #e5e7eb;border-radius:14px;padding:22px;margin:18px 0}.admin-input,.admin-select{width:100%;box-sizing:border-box;border:1px solid #d7dde6;border-radius:8px;padding:11px;margin:5px 0}.admin-btn{border:0;border-radius:8px;padding:10px 14px;font-weight:800;cursor:pointer;background:#e63946;color:#fff;margin:8px 6px 0 0}.admin-fields{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}.admin-fields label{font-size:10px}.admin-fields input{width:100%;box-sizing:border-box;padding:7px}.admin-player,.roster-admin-card,.team-card-admin,.standing-row{border:1px solid #e5e7eb;border-radius:10px;padding:12px;margin:10px 0}.hidden{display:none!important}@media(max-width:760px){.admin-fields{grid-template-columns:repeat(2,1fr)}}</style></head><body><header class="site-header"><div class="container nav-wrap"><a class="logo" href="kbo.html">KBO LEAGUE</a><a href="kbo.html" style="color:#fff">← 사이트</a></div></header><main class="admin-wrap"><section id="login-box" class="admin-box"><h1>관리자 로그인</h1><input id="admin-password" class="admin-input" type="password" placeholder="비밀번호"><button id="login" class="admin-btn">관리 페이지 열기</button><p id="login-status"></p></section><section id="workspace" class="hidden"><section class="admin-box"><h2>🏆 순위표 관리</h2><div id="standings"></div><button id="save-standings" class="admin-btn">순위 저장</button></section><section class="admin-box"><h2>🏟️ 팀 관리</h2><div id="teams"></div><button id="add-team" class="admin-btn">+ 팀 추가</button><button id="save-teams" class="admin-btn">팀 저장</button></section><section class="admin-box"><h2>👥 로스터 관리</h2><div id="roster-admin"></div><button id="save-rosters" class="admin-btn">로스터 저장</button></section><section class="admin-box"><h2>📊 선수 성적 관리</h2><input id="search" class="admin-input" placeholder="선수 닉네임 검색..."><select id="team" class="admin-select"><option value="">모든 팀</option></select><button id="add" class="admin-btn">+ 선수 추가</button><button id="save" class="admin-btn">선수 성적 저장</button><div id="players"></div><p id="status"></p></section></section></main><script src="kbo-admin.js?v=4"></script></body></html>
