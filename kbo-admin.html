<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>KBO Admin</title><link rel="stylesheet" href="styles.css"><style>.admin-wrap{max-width:900px;margin:auto;padding:55px 4%}.admin-box{background:#fff;border:1px solid #e5e7eb;border-radius:14px;padding:22px;margin:18px 0}.admin-input{width:100%;box-sizing:border-box;border:1px solid #d7dde6;border-radius:8px;padding:11px;margin:5px 0}.admin-btn{border:0;border-radius:8px;padding:10px 14px;font-weight:800;cursor:pointer;background:#e63946;color:#fff;margin-top:8px}.team-card-admin{border:1px solid #e5e7eb;border-radius:10px;padding:12px;margin:10px 0}.hidden{display:none!important}</style></head><body><header class="site-header"><div class="container nav-wrap"><a class="logo" href="kbo.html">KBO LEAGUE</a><a href="kbo.html" style="color:#fff">← 사이트</a></div></header><main class="admin-wrap"><div class="section-heading"><div><p class="eyebrow">KBO ADMIN</p><h1>사이트 관리</h1><p>선수 성적과 팀 정보를 관리합니다.</p></div></div><section class="admin-box"><h2>GitHub 인증</h2><input id="token" class="admin-input" type="password" placeholder="GitHub token"><button id="load" class="admin-btn">불러오기</button><p id="status"></p></section><section id="workspace" class="hidden"><section class="admin-box"><h2>팀 관리</h2><p>팀 이름과 로고 URL을 수정할 수 있습니다. 로고는 이미지 주소를 입력하세요.</p><div id="teams"></div><button id="add-team" class="admin-btn">+ 팀 추가</button><button id="save-teams" class="admin-btn">팀 저장 → GitHub</button></section><section class="admin-box"><h2>선수 성적</h2><p>KBO 선수 데이터 관리 기능은 다음 단계에서 KFB Admin과 동일하게 연결할 수 있습니다.</p></section></section></main><script src="kbo-admin.js?v=1"></script></body></html>
